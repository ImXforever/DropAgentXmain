<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="DropAgentX — مارکت‌پلیس محصولات دیجیتال با پرداخت کردیت داخل بات تلگرام">
<meta name="theme-color" content="#0b0e14">
<meta property="og:title" content="DropAgentX">
<meta property="og:description" content="مارکت‌پلیس محصولات دیجیتال — خرید از داخل بات تلگرام">
<meta property="og:type" content="website">
<title>DropAgentX — مارکت‌پلیس محصولات دیجیتال</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0e14;--panel:#131824;--panel2:#0f1420;--line:#232b3d;--txt:#e8ecf4;
        --dim:#8b94a8;--gold:#f5c451;--green:#34d399}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:radial-gradient(1000px 500px at 80% -10%,#17203a44,transparent),var(--bg);
       color:var(--txt);font-family:Vazirmatn,Tahoma,sans-serif;padding-bottom:60px}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  ::selection{background:#f5c45140}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#232b3d;border-radius:8px}
  .num{direction:ltr;display:inline-block;font-family:Consolas,'Courier New',monospace;font-style:normal}
  .dim{color:var(--dim)}
  header{display:flex;align-items:center;gap:16px;padding:18px clamp(14px,4vw,48px);
         border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b0e14ee;backdrop-filter:blur(8px);z-index:9;flex-wrap:wrap;transition:box-shadow .25s}
  header.scrolled{box-shadow:0 6px 24px #0006}
  .logo{font-weight:800;font-size:19px}
  .logo b{color:var(--gold)}
  .search{flex:1;min-width:220px;display:flex;gap:8px;align-items:center}
  .qwrap{position:relative;flex:1;display:flex}
  .search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;
                padding:11px 16px;padding-inline-end:34px;color:var(--txt);font-family:inherit;font-size:14px;outline:none}
  .search input:focus{border-color:var(--gold)}
  .qc{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--dim);cursor:pointer;font-size:13px;padding:4px}
  .qc:hover{color:var(--red,#f87171)}
  .tg-btn{background:linear-gradient(135deg,#34d399,#10b981);color:#052e21;font-weight:800;font-family:inherit;
          border-radius:12px;padding:11px 18px;font-size:13.5px;white-space:nowrap;border:0;cursor:pointer}
  .tg-btn:hover{filter:brightness(1.06)}
  .tg-btn.ghost{background:var(--panel);color:var(--gold);border:1px solid var(--line)}
  main{max-width:1200px;margin:0 auto;padding:26px clamp(14px,4vw,40px)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:99px;
        padding:8px 18px;font-size:13px;cursor:pointer;transition:.2s;font-family:inherit}
  .chip.on,.chip:hover{border-color:var(--gold);color:var(--gold)}
  .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .tools select{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:12px;
                padding:9px 14px;font-family:inherit;font-size:13px;cursor:pointer;outline:none}
  .tools select:focus{border-color:var(--gold)}
  #cnt{color:var(--dim);font-size:12.5px}
  .grow{flex:1}
  .icon-b{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:11px;
          width:38px;height:38px;cursor:pointer;font-size:15px;transition:.2s}
  .icon-b:hover{color:var(--gold);border-color:var(--gold)}
  .spin{animation:rot .5s linear}
  @keyframes rot{to{transform:rotate(-360deg)}}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;
        cursor:pointer;transition:.2s;display:flex;flex-direction:column;animation:cardin .3s ease both}
  @keyframes cardin{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
  .card:hover{transform:translateY(-4px);border-color:var(--gold)}
  .thumb{height:140px;position:relative;display:flex;align-items:center;justify-content:center;
         background:linear-gradient(135deg,#1a2133,#12161f)}
  .th-ic{font-size:52px}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .badge{position:absolute;top:10px;right:10px;z-index:2;background:var(--gold);color:#201602;
         font-size:10px;font-weight:800;border-radius:99px;padding:4px 12px}
  .c-body{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;gap:7px}
  .c-title{font-size:14.5px;font-weight:700;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .c-meta{display:flex;justify-content:space-between;align-items:center;margin-top:auto;color:var(--dim);font-size:12px;gap:8px}
  .price{color:var(--green);font-weight:800;font-size:15px}
  .stars{color:var(--gold);font-size:12px}
  .empty{text-align:center;color:var(--dim);padding:70px 20px;line-height:2.2}
  .empty .tg-btn{margin-top:12px}
  /* modal */
  #modalWrap{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  #modalWrap.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:22px;max-width:560px;width:100%;
         max-height:88vh;overflow:auto;padding:28px}
  .modal h2{font-size:19px;margin:10px 0 6px;line-height:1.7}
  .modal .desc{color:#c3cad8;font-size:13.5px;line-height:2.1;white-space:pre-wrap;margin-bottom:18px}
  .m-media{font-size:56px;line-height:1}
  .m-media img{max-width:100%;max-height:220px;border-radius:14px;display:block}
  .m-stars{margin:2px 0 12px;font-size:13px;color:var(--dim)}
  .buy{width:100%;margin-top:18px;padding:14px;font-size:15px}
  .m-load{padding:60px 20px;text-align:center;color:var(--dim);line-height:2}
  .m-load.err{color:#f87171}
  .m-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--dim)}
  .m-price{font-size:24px;font-weight:800;color:var(--green);margin:14px 0}
  .m-price small{font-size:14px;color:var(--dim);font-weight:400}
  .tags span{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:99px;
             padding:4px 12px;font-size:11px;color:var(--dim);margin:0 0 6px 6px}
  .close{float:left;background:none;border:0;color:var(--dim);font-size:22px;cursor:pointer}
  .close:hover{color:var(--txt)}
  /* lb */
  .lb{margin-top:40px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 24px}
  .lb h3{font-size:15px;margin-bottom:14px;color:var(--gold)}
  .lb-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;color:#c3cad8;gap:10px}
  .lb-row:last-child{border:0}
  .lb-row b{color:var(--txt)}
  .lb-row.m1 b{color:var(--gold)} .lb-row.m2 b{color:#cbd5e1} .lb-row.m3 b{color:#d09b6c}
  footer{text-align:center;color:var(--dim);font-size:12px;margin-top:50px;line-height:2}
  #toast{position:fixed;bottom:20px;right:50%;transform:translateX(50%);background:#1c2536;border:1px solid var(--line);
         color:var(--txt);padding:11px 24px;border-radius:12px;font-size:13px;z-index:99;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  #toast.bad{border-color:#f8717166;color:#fca5a5}
  #net{position:fixed;top:0;left:0;right:0;background:#7f1d1d;color:#fecaca;text-align:center;padding:6px 10px;font-size:12px;z-index:100}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="net" hidden>⚠️ اتصال اینترنت قطع است — بعد از وصل‌شدن، داده‌ها خودکار رفرش می‌شوند</div>
<header>
  <div class="logo">🛍️ هرمس <b>مارکت</b></div>
  <div class="search">
    <span class="qwrap">
      <input id="q" placeholder="جستجوی محصول، تگ، دسته…" aria-label="جستجو">
      <button id="qc" class="qc" type="button" hidden aria-label="پاک کردن جستجو">✕</button>
    </span>
    <button class="tg-btn" id="tgBtn" type="button">Open in Telegram ↗</button>
  </div>
</header>

<main>
  <div class="chips" id="chips"></div>
  <div class="tools">
    <select id="sortSel" aria-label="مرتب‌سازی"></select>
    <span id="cnt"></span>
    <span class="grow"></span>
    <button class="icon-b" id="rfsh" type="button" title="رفرش دستی" aria-label="رفرش">🔄</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"></div>

  <div class="lb" id="lb">
    <h3>🏆 فروشندگان برتر (لیدربرد کردیت)</h3>
    <div id="lbRows"><div class="m-load">…در حال بارگذاری</div></div>
  </div>

  <footer>قدرت‌گرفته از Hermes Agent · خرید فقط از داخل بات تلگرام انجام می‌شود · ۵۰ کردیت هدیه ثبت‌نام 🎁 · © <span id="yr"></span></footer>
</main>

<div id="modalWrap">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" role="status"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const NF=new Intl.NumberFormat('en-US');
const fmt=n=>NF.format(Number(n)||0);
const esc=s=>(s??'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const grid=$('#grid'),chips=$('#chips'),empty=$('#empty'),lbRows=$('#lbRows'),modal=$('#modal'),
      modalWrap=$('#modalWrap'),qEl=$('#q'),qc=$('#qc'),cnt=$('#cnt'),sortSel=$('#sortSel'),
      rfsh=$('#rfsh'),tgBtn=$('#tgBtn'),netEl=$('#net'),toastEl=$('#toast'),headerEl=$('header');

const CAT_ICON={general:'📦',education:'📚',template:'🧩',file:'🗂️',art:'🎨',music:'🎵',
                course:'🎓',ebook:'📘',software:'💾',design:'🖌️',video:'🎬'};
const SORTS=[['new','🆕 جدیدترین'],['cheap','⬇️ ارزان‌ترین'],['exp','⬆️ گران‌ترین'],
             ['sold','🔥 پرفروش‌ترین'],['top','⭐ محبوب‌ترین']];
let CATS=[],INFO=null,LAST_FOCUS=null,ABORT=null,TOAST_T=null,deb=0;
let CUR={q:'',cat:'',sort:(()=>{try{return localStorage.getItem('hm_sort')||'new'}catch(_){return 'new'}})()};
if(!SORTS.some(s=>s[0]===CUR.sort))CUR.sort='new';

async function jget(url,{to=8000}={}){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),to);
  try{
    const r=await fetch(url,{signal:c.signal});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(typeof d.detail==='string'&&d.detail?d.detail:'HTTP '+r.status);
    return d;
  }catch(e){
    if(e.name==='AbortError')throw new Error('زمان پاسخ سرور تمام شد');
    throw e;
  }finally{clearTimeout(t)}
}

function toast(m,bad){
  toastEl.textContent=m;
  toastEl.classList.toggle('bad',!!bad);
  toastEl.classList.add('show');
  clearTimeout(TOAST_T);
  TOAST_T=setTimeout(()=>toastEl.classList.remove('show'),bad?4200:2600);
}

/* ---------- telegram button ---------- */
async function openTg(){
  try{
    if(!INFO)INFO=await jget('/api/pub/info');
    const u=(INFO||{}).bot_username;
    if(u)window.open('https://t.me/'+u,'_blank','noopener');
    else toast('یوزرنیم بات روی سرور تنظیم نشده (BOT_USERNAME)',true);
  }catch(e){toast('اطلاعات بات دریافت نشد: '+e.message,true)}
}

/* ---------- chips / categories ---------- */
async function loadChips(){
  INFO=await jget('/api/pub/info');
  CATS=INFO.categories||[];
  chips.innerHTML='<button class="chip on" data-c="" type="button">همه</button>'+
    CATS.map(c=>'<button class="chip" data-c="'+esc(c)+'" type="button">'+((CAT_ICON[c]||'📦')+' '+esc(c))+'</button>').join('');
}

/* ---------- cards ---------- */
function starsHtml(s,n){
  const v=Math.max(0,Math.min(5,+s||0));
  const full='★'.repeat(Math.round(v))+'☆'.repeat(5-Math.round(v));
  return n?`<span class="stars">${full} <i class="num">${v.toFixed(1)}</i> (${+n})</span>`
          :'<span class="stars dim" title="هنوز رای ثبت نشده">بدون امتیاز</span>';
}
function usdEq(credits){
  const per=(INFO&&INFO.credits_per_usdt)||1000;
  const v=(+credits||0)/per;
  return '≈'+(v>=100?v.toFixed(0):v.toFixed(2))+'$';
}
function card(p){
  const icon=CAT_ICON[p.category]||'📦';
  const img=p.photo_url?`<img src="${esc(p.photo_url)}" alt="${esc(p.title)}" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:'';
  return `<article class="card" tabindex="0" role="button" data-id="${+p.id}" aria-label="${esc(p.title)}">
    <div class="thumb"><span class="th-ic">${icon}</span>${img}${p.is_featured?'<span class="badge">⭐ ویژه</span>':''}</div>
    <div class="c-body">
      <h3 class="c-title">${esc(p.title)}</h3>
      ${starsHtml(p.stars,p.reviews)}
      <div class="c-meta"><span class="price"><i class="num">${fmt(p.price_credits)}</i> <small>کردیت (${usdEq(p.price_credits)})</small></span>
        <span>${p.sales_count?p.sales_count+' فروش':'جدید'}</span></div>
      <div class="c-meta"><span>👤 ${esc(p.creator_name||p.creator_username||'ناشناس')}</span></div>
    </div></article>`;
}
function wireThumbs(root){
  root.querySelectorAll('.thumb img').forEach(im=>{
    im.addEventListener('error',()=>im.remove(),{once:true});
  });
}

/* ---------- sorting / grid ---------- */
function applySort(arr){
  const a=[...arr];
  if(CUR.sort==='cheap')a.sort((x,y)=>(+x.price_credits||0)-(+y.price_credits||0));
  else if(CUR.sort==='exp')a.sort((x,y)=>(+y.price_credits||0)-(+x.price_credits||0));
  else if(CUR.sort==='sold')a.sort((x,y)=>(+y.sales_count||0)-(+x.sales_count||0));
  else if(CUR.sort==='top')a.sort((x,y)=>((+y.stars||0)-(+x.stars||0))||((+y.reviews||0)-(+x.reviews||0)));
  else a.sort((x,y)=>(+y.id||0)-(+x.id||0));
  return a;
}
function emptyHtml(){
  return (CUR.q||CUR.cat)
    ?'چیزی مطابق فیلترها پیدا نشد.<br><button class="tg-btn ghost" id="clrF" type="button">پاک کردن فیلترها</button>'
    :'هنوز محصولی منتشر نشده.<br>از داخل بات تلگرام اولین محصولت را بساز!';
}
function bindClr(){
  const b=$('#clrF');
  if(b)b.onclick=()=>{
    CUR.q='';CUR.cat='';qEl.value='';qc.hidden=true;
    chips.querySelectorAll('.chip').forEach((x,i)=>x.classList.toggle('on',i===0));
    loadGrid();
  };
}
function gridError(msg){
  cnt.textContent='—';
  grid.innerHTML=`<div class="empty" style="grid-column:1/-1">⚠️ ${esc(msg||'خطا')}<br><button class="tg-btn ghost" onclick="loadGrid()" type="button">تلاش مجدد</button></div>`;
}
async function loadGrid(){
  if(ABORT)ABORT.abort();
  ABORT=new AbortController();
  const sig=ABORT.signal;
  grid.setAttribute('aria-busy','true');
  try{
    const u='/api/pub/catalog?q='+encodeURIComponent(CUR.q)+'&cat='+encodeURIComponent(CUR.cat)+'&limit=48';
    const r=await fetch(u,{signal:sig});
    const d=await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(typeof d.detail==='string'&&d.detail?d.detail:'HTTP '+r.status);
    if(sig.aborted)return;
    const items=applySort(d.items||[]);
    grid.innerHTML=items.map(card).join('');
    wireThumbs(grid);
    cnt.textContent=items.length.toLocaleString('fa-IR')+' محصول';
    empty.style.display=items.length?'none':'block';
    if(!items.length){empty.innerHTML=emptyHtml();bindClr()}
  }catch(e){
    if(e.name==='AbortError'||sig.aborted)return;
    gridError(e.message);
  }finally{
    if(!sig.aborted)grid.removeAttribute('aria-busy');
  }
}

/* ---------- product modal ---------- */
function tagsHtml(t){
  const list=t.split(',').map(x=>x.trim()).filter(Boolean);
  return list.length?'<div class="tags">'+list.map(x=>'<span>#'+esc(x)+'</span>').join('')+'</div>':'';
}
async function showProduct(id){
  LAST_FOCUS=document.activeElement;
  modal.innerHTML='<div class="m-load">…در حال بارگذاری</div>';
  modalWrap.classList.add('open');
  document.body.style.overflow='hidden';
  try{
    const d=await jget('/api/pub/product/'+id);
    const p=d.item;
    if(!p)throw new Error('محصول پیدا نشد');
    const icon=CAT_ICON[p.category]||'📦';
    const usd=Number(p.price_usdt||p.price_usd||0);
    modal.innerHTML=`
      <button class="close" type="button" aria-label="بستن">✕</button>
      <div class="m-media">${p.photo_url?`<img src="${esc(p.photo_url)}" alt="${esc(p.title)}" decoding="async" referrerpolicy="no-referrer">`:icon}</div>
      <h2>${esc(p.title)}</h2>
      <div class="m-stars">${starsHtml(p.stars,p.reviews)}${p.sales_count?' · <i class="num">'+p.sales_count+'</i> فروش':''}</div>
      <div class="desc">${esc(p.description||'—')}</div>
      ${p.tags?tagsHtml(p.tags):''}
      <div class="m-price"><i class="num">${fmt(p.price_credits)}</i> کردیت <small>(${usdEq(p.price_credits)})</small></div>
      <div class="m-row"><span>👤 فروشنده: ${esc(p.creator_name||p.creator_username||'—')}</span><span>دسته: ${esc(p.category||'—')}</span></div>
      <button class="tg-btn buy" type="button" id="buyBtn">خرید از بات تلگرام ↗</button>`;
    wireThumbs(modal);
    $('#buyBtn').onclick=openTg;
    modal.querySelector('.close').focus();
  }catch(e){
    modal.innerHTML=`<button class="close" type="button" aria-label="بستن">✕</button><div class="m-load err">⚠️ ${esc(e.message||'خطا')}<br>ممکن است محصول حذف یا غیرفعال شده باشد.</div>`;
    modal.querySelector('.close').focus();
  }
}
function closeModal(){
  if(!modalWrap.classList.contains('open'))return;
  modalWrap.classList.remove('open');
  document.body.style.overflow='';
  if(LAST_FOCUS&&LAST_FOCUS.focus){LAST_FOCUS.focus();LAST_FOCUS=null}
}

/* ---------- leaderboard ---------- */
async function loadLb(){
  const d=await jget('/api/pub/leaderboard');
  const items=d.items||[];
  lbRows.innerHTML=items.length?items.map((u,i)=>
    `<div class="lb-row${i<3?' m'+(i+1):''}"><span>${['🥇','🥈','🥉'][i]||('#'+(i+1))} <b>${esc(u.name||'کاربر')}</b></span>
     <span><i class="num">${fmt(u.credits)}</i> کردیت · <i class="num">${fmt(u.sold)}</i> فروش</span></div>`).join('')
   :'<div class="lb-row">هنوز فروشی ثبت نشده — نفر اول باش! 🏁</div>';
}

/* ---------- events ---------- */
chips.addEventListener('click',e=>{
  const el=e.target.closest('.chip');if(!el)return;
  CUR.cat=el.dataset.c;
  chips.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===el));
  loadGrid();
});
grid.addEventListener('click',e=>{
  const c=e.target.closest('.card');
  if(c)showProduct(+c.dataset.id);
});
grid.addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const c=e.target.closest('.card');if(!c)return;
  e.preventDefault();showProduct(+c.dataset.id);
});
modalWrap.addEventListener('click',e=>{
  if(e.target===modalWrap||e.target.closest('.close'))closeModal();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
/* "/" shortcut → jump to search (skipped while typing or modal open) */
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!$('#modalWrap').classList.contains('open')){
    const t=document.activeElement;
    if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'))return;
    e.preventDefault();document.getElementById('q').focus();
  }
});
tgBtn.addEventListener('click',openTg);

function commitSearch(){CUR.q=qEl.value.trim();loadGrid()}
qEl.addEventListener('input',()=>{
  qc.hidden=!qEl.value;
  clearTimeout(deb);deb=setTimeout(commitSearch,300);
});
qEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();clearTimeout(deb);commitSearch()}
  else if(e.key==='Escape'){qEl.value='';qc.hidden=true;clearTimeout(deb);commitSearch()}
});
qc.addEventListener('click',()=>{qEl.value='';qc.hidden=true;qEl.focus();clearTimeout(deb);commitSearch()});

rfsh.addEventListener('click',()=>{
  rfsh.classList.add('spin');
  Promise.resolve(loadGrid()).finally(()=>setTimeout(()=>rfsh.classList.remove('spin'),450));
});

sortSel.innerHTML=SORTS.map(([v,l])=>`<option value="${v}"${v===CUR.sort?' selected':''}>${l}</option>`).join('');
sortSel.addEventListener('change',()=>{
  CUR.sort=sortSel.value;
  try{localStorage.setItem('hm_sort',CUR.sort)}catch(_){}
  loadGrid();
});

/* ---------- timers / connectivity ---------- */
setInterval(()=>{if(!document.hidden&&!modalWrap.classList.contains('open'))loadGrid()},60000);
setInterval(()=>{if(!document.hidden)loadLb().catch(()=>{})},300000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadGrid()});
addEventListener('online',()=>{netEl.hidden=true;loadGrid()});
addEventListener('offline',()=>{netEl.hidden=false});
addEventListener('scroll',()=>headerEl.classList.toggle('scrolled',scrollY>8),{passive:true});

/* ---------- init ---------- */
$('#yr').textContent=new Date().toLocaleDateString('fa-IR',{year:'numeric'});
loadChips().catch(e=>toast('دسته‌ها لود نشد: '+e.message,true));
loadGrid();
loadLb().catch(()=>{lbRows.innerHTML='<div class="lb-row">لیدربرد در دسترس نیست ⚠️</div>'});
</script>
</body>
</html>
