version: "3.8"

services:
  dropagentx-bot:
    build: .
    container_name: dropagentx
    restart: unless-stopped
    env_file: .env
    ports:
      - "${WEB_PORT:-8080}:${WEB_PORT:-8080}"
    init: true
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  dropagentx-web:
    build:
      context: ./web-next
      args:
        BACKEND_URL: http://dropagentx-bot:8080
    container_name: dropagentx-web
    restart: unless-stopped
    depends_on:
      - dropagentx-bot
    environment:
      BACKEND_URL: http://dropagentx-bot:8080
    ports:
      - "3000:3000"
    init: true
